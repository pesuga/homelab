---
# Dedicated Authentik Proxy Outpost for ForwardAuth
# This outpost runs separately and specifically handles ForwardAuth requests
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-proxy
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-proxy
    app.kubernetes.io/component: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-proxy
      app.kubernetes.io/component: outpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-proxy
        app.kubernetes.io/component: outpost
    spec:
      containers:
      - name: authentik-proxy
        image: ghcr.io/goauthentik/proxy:2024.2.1
        ports:
        - name: http
          containerPort: 9000
          protocol: TCP
        - name: https
          containerPort: 9443
          protocol: TCP
        env:
        - name: AUTHENTIK_HOST
          value: "http://authentik-server.authentik.svc.cluster.local:9000"
        - name: AUTHENTIK_INSECURE
          value: "true"
        - name: AUTHENTIK_TOKEN
          valueFrom:
            secretKeyRef:
              name: authentik-outpost-token
              key: token
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-proxy
  namespace: authentik
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9000
    targetPort: 9000
    protocol: TCP
  selector:
    app.kubernetes.io/name: authentik-proxy
    app.kubernetes.io/component: outpost