apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fa-platform
  labels:
    app.kubernetes.io/name: family-assistant
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: homelab
  annotations:
    prometheus.io/scrape: "false"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: family-assistant
    app.kubernetes.io/component: frontend
