apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-assistant-app
  namespace: fa-platform
  labels:
    app.kubernetes.io/name: family-assistant
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: family-assistant-app
  template:
    metadata:
      labels:
        app: family-assistant-app
        app.kubernetes.io/name: family-assistant
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: app
          # TODO: Switch to ghcr.io once build issues are resolved
          # Current issues: TypeScript errors in auth module, missing lib/auth
          image: 100.75.194.1:30500/family-portal:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
