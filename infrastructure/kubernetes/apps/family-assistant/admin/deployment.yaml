apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: fa-platform
  labels:
    app.kubernetes.io/name: family-admin
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: family-assistant
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: family-admin
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: family-admin
        app.kubernetes.io/component: admin
        app.kubernetes.io/part-of: family-assistant
      annotations:
        checksum/config: "family-assistant-admin-config-v1"
        prometheus.io/scrape: "false"
    spec:
      containers:
        - name: admin
          image: ghcr.io/pesuga/homelab/family-admin:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Server-side API URLs
            - name: FAMILY_API_URL
              value: "http://backend.fa-platform.svc.cluster.local:8001"
            - name: LLAMACPP_API_URL
              value: "http://llamacpp-kimi-vl-service.llamacpp.svc.cluster.local:8080"
            - name: MEM0_API_URL
              value: "http://mem0.homelab.svc.cluster.local:8080"

            # Client-side URLs
            - name: NEXT_PUBLIC_APP_URL
              value: "https://app.fa.pesulabs.net"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.fa.pesulabs.net"
            - name: NEXT_PUBLIC_DEV_BYPASS_AUTH
              value: "false"

            # Authentication - NextAuth
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: family-assistant-secrets
                  key: nextauth-secret
            - name: NEXTAUTH_URL
              value: "https://admin.fa.pesulabs.net"

            # Authentication - Authentik OIDC
            - name: AUTHENTIK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: family-admin-oidc
                  key: issuer
            - name: AUTHENTIK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: family-admin-oidc
                  key: client-id
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: family-admin-oidc
                  key: client-secret

            # Application settings
            - name: NODE_ENV
              value: "production"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
