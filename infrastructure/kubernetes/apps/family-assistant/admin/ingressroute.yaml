# Family Admin IngressRoute with Authentik Authentication
# All requests to admin.fa.pesulabs.net will be authenticated through Authentik

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: family-assistant-admin
  namespace: fa-platform
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`admin.fa.pesulabs.net`)
      kind: Rule
      services:
        - name: family-assistant-admin
          port: 80
      middlewares:
        - name: authentik
          namespace: authentik
  tls:
    certResolver: letsencrypt