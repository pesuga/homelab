apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fa-platform
  labels:
    app: family-assistant-backend
    component: familyai-v3
    version: v2.2.0
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: family-assistant-backend
      app.kubernetes.io/component: backend
      app.kubernetes.io/name: family-assistant
      app.kubernetes.io/part-of: familyai-v3
      component: familyai-v3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: family-assistant-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/name: family-assistant
        app.kubernetes.io/part-of: familyai-v3
        component: familyai-v3
        version: v2.2.0
      annotations:
        kubectl.kubernetes.io/restartedAt: "2025-11-23T22:15:00-03:00"
    spec:
      nodeSelector:
        kubernetes.io/hostname: pesubuntu
      initContainers:
        - name: init-prompts
          image: 100.81.76.55:30500/family-assistant:v2.2.0-enhanced
          imagePullPolicy: Always
          command:
            [
              "/bin/sh",
              "-c",
              "mkdir -p /app/prompts-data && cp -r /app/src/prompts/* /app/prompts-data/",
            ]
          volumeMounts:
            - name: prompts-volume
              mountPath: "/app/prompts-data"
      containers:
        - name: backend
          image: 100.81.76.55:30500/family-assistant:v2.2.0-enhanced
          imagePullPolicy: Always
          ports:
            - name: http-api
              containerPort: 8001
              protocol: TCP
            - name: ha-api
              containerPort: 8123
              protocol: TCP
            - name: matrix-api
              containerPort: 8008
              protocol: TCP
          env:
            - name: PROMPTS_DIR
              value: "/app/prompts-data"
            - name: POSTGRES_HOST
              value: postgres.homelab.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: homelab
            - name: POSTGRES_PASSWORD
              value: homelab123 # TODO: Move to Secret
            - name: POSTGRES_DB
              value: homelab
            - name: DATABASE_URL
              value: postgresql+asyncpg://homelab:homelab123@postgres.homelab.svc.cluster.local:5432/homelab
            - name: REDIS_HOST
              value: redis.homelab.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DB
              value: "0"
            - name: QDRANT_URL
              value: http://qdrant.homelab.svc.cluster.local:6333
            - name: QDRANT_GRPC_URL
              value: http://qdrant.homelab.svc.cluster.local:6334
            - name: LLAMACPP_BASE_URL
              value: "http://llamacpp-service.default.svc.cluster.local:8081"
            - name: OLLAMA_BASE_URL
              value: "http://llamacpp-service.default.svc.cluster.local:8081"
            - name: MEM0_API_URL
              value: "http://mem0.homelab.svc.cluster.local:8080"
            - name: N8N_BASE_URL
              value: "http://n8n.homelab.svc.cluster.local:5678"
            - name: SECRET_KEY
              value: ChangeMe!2024#Secure # TODO: Move to Secret
            - name: PYTHONPATH
              value: /app/src
            - name: AUTHENTIK_URL
              value: "https://auth.pesulabs.net"
            - name: AUTHENTIK_CLIENT_ID
              value: "tw2kzde62QPl0dzYhY6YR9vjEQ4GYHcJ4KIa7fbD"
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: client-secret
            - name: OTEL_SDK_DISABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: prompts-volume
              mountPath: "/app/prompts-data"
            - name: source-code
              mountPath: "/app/src"
      volumes:
        - name: prompts-volume
          emptyDir: {}
        - name: source-code
          hostPath:
            path: /home/pesu/Rakuflow/systems/homelab/services/family-api/src
            type: Directory
