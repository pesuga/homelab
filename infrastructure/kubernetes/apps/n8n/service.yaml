apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: homelab
  labels:
    app: n8n
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: automation
spec:
  type: ClusterIP
  selector:
    app: n8n
  ports:
    - name: http
      port: 80
      targetPort: 5678
      protocol: TCP
    - name: http-alt
      port: 5678
      targetPort: 5678
      protocol: TCP
