apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        ports:
        - containerPort: 5678
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
        env:
        - name: N8N_HOST
          value: "0.0.0.0"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-pvc
