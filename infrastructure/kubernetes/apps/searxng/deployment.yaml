apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          env:
            - name: SEARXNG_BASE_URL
              value: "http://searxng.homelab.svc.cluster.local:8080/"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: searxng-config
