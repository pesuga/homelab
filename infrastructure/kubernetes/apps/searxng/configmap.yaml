apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: homelab
data:
  settings.yml: |
    use_default_settings: true
    server:
      limiter: false
      image_proxy: true
      secret_key: "searxng-homelab-secret-change-me"
      bind_address: "0.0.0.0"
      port: 8080
    search:
      safe_search: 0
      autocomplete: "google"
      default_lang: "en"
      formats:
        - html
        - json
    engines:
      - name: google
        engine: google
        shortcut: g
        disabled: false
      - name: duckduckgo
        engine: duckduckgo
        shortcut: ddg
        disabled: false
      - name: bing
        engine: bing
        shortcut: b
        disabled: false
      - name: wikipedia
        engine: wikipedia
        shortcut: wp
        disabled: false
    outgoing:
      request_timeout: 5.0
      max_request_timeout: 15.0
