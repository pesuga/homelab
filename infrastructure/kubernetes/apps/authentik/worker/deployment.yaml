apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: authentik
  labels:
    app: authentik-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      containers:
        - name: authentik-worker
          image: ghcr.io/goauthentik/server:2024.2.1
          args: ["worker"]
          env:
            - name: AUTHENTIK_REDIS__HOST
              value: "authentik-redis.authentik.svc.cluster.local"
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: "authentik-postgresql.authentik.svc.cluster.local"
            - name: AUTHENTIK_POSTGRESQL__USER
              value: "authentik"
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: "authentik"
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              value: "DIhob2/AE/2cX1S8F+MWWoaDJB5eoDAo" # Generated by Gemini
            - name: AUTHENTIK_SECRET_KEY
              value: "C1btCGjjywkRhQ1LAWrZpB5gR26c8/GQg4fyEjwZYr4="
            - name: AUTHENTIK_BOOTSTRAP_HOST_URL
              value: "https://auth.pesulabs.net"
