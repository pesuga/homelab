apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  selector:
    matchLabels:
      app: authentik-postgresql
  template:
    metadata:
      labels:
        app: authentik-postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: "DIhob2/AE/2cX1S8F+MWWoaDJB5eoDAo" # Generated by Gemini
            - name: POSTGRES_USER
              value: "authentik"
            - name: POSTGRES_DB
              value: "authentik"
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: database
          emptyDir: {} # For persistence, use PVC
