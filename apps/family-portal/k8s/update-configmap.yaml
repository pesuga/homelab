apiVersion: v1
kind: ConfigMap
metadata:
  name: family-frontend-ui
  namespace: fa-platform
data:
  simple-frontend-app.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Family Assistant</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                max-width: 600px;
                margin: 0 auto;
                padding: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                color: white;
            }
            .chat-container {
                background: rgba(255, 255, 255, 0.95);
                border-radius: 12px;
                padding: 20px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.3);
                color: #333;
            }
            .header {
                text-align: center;
                margin-bottom: 30px;
            }
            .header h1 {
                color: #4a5568;
                margin: 0;
                font-size: 2em;
            }
            .header p {
                color: #718096;
                margin: 5px 0 0 0;
            }
            .chat-messages {
                height: 400px;
                overflow-y: auto;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                padding: 15px;
                background: #f8fafc;
                margin-bottom: 20px;
            }
            .message {
                margin-bottom: 15px;
                padding: 10px 12px;
                border-radius: 18px;
                max-width: 80%;
                word-wrap: break-word;
            }
            .user-message {
                background: #4299e1;
                color: white;
                margin-left: auto;
                text-align: right;
            }
            .assistant-message {
                background: #e2e8f0;
                color: #2d3748;
                margin-right: auto;
            }
            .input-container {
                display: flex;
                gap: 10px;
                margin-bottom: 20px;
            }
            .message-input {
                flex: 1;
                padding: 12px 16px;
                border: 2px solid #e2e8f0;
                border-radius: 25px;
                font-size: 16px;
                outline: none;
                transition: border-color 0.3s;
            }
            .message-input:focus {
                border-color: #4299e1;
            }
            .send-button {
                padding: 12px 24px;
                background: #4299e1;
                color: white;
                border: none;
                border-radius: 25px;
                cursor: pointer;
                font-size: 16px;
                transition: background-color 0.3s;
            }
            .send-button:hover {
                background: #3182ce;
            }
            .send-button:disabled {
                background: #cbd5e0;
                cursor: not-allowed;
            }
            .status-bar {
                background: #f7fafc;
                padding: 10px;
                border-radius: 8px;
                margin-bottom: 15px;
                font-size: 14px;
                color: #4a5568;
                text-align: center;
            }
            .status-indicator {
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                margin-right: 6px;
            }
            .status-online { background-color: #48bb78; }
            .status-offline { background-color: #f56565; }
            .typing-indicator {
                color: #718096;
                font-style: italic;
                display: none;
            }
            .feature-buttons {
                display: flex;
                gap: 10px;
                margin-bottom: 15px;
                flex-wrap: wrap;
            }
            .feature-button {
                padding: 8px 16px;
                background: #edf2f7;
                color: #4a5568;
                border: 1px solid #cbd5e0;
                border-radius: 20px;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.3s;
            }
            .feature-button:hover {
                background: #e2e8f0;
                border-color: #4299e1;
                color: #2b6cb0;
            }
        </style>
    </head>
    <body>
        <div class="chat-container">
            <div class="header">
                <h1>🏠 Family Assistant</h1>
                <p>AI-Powered Home Management (v1.1.0)</p>
            </div>

            <div class="status-bar">
                <span class="status-indicator" id="connection-status"></span>
                <span id="status-text">Checking connection...</span>
            </div>

            <div class="feature-buttons">
                <button class="feature-button" onclick="sendQuickMessage('What can you help me with?')">💬 Capabilities</button>
                <button class="feature-button" onclick="sendQuickMessage('Set a reminder for family dinner')">⏰ Set Reminder</button>
                <button class="feature-button" onclick="sendQuickMessage('Add milk to shopping list')">🛒 Shopping List</button>
                <button class="feature-button" onclick="sendQuickMessage('Tell me a family fun fact')">🎉 Fun Fact</button>
                <button class="feature-button" onclick="sendQuickMessage('Help me organize my schedule')">📅 Schedule Help</button>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="message assistant-message">
                    👋 Hello! I'm your Family Assistant. I can help you manage your home, schedule, and daily tasks. What would you like to do today?
                </div>
            </div>

            <div class="typing-indicator" id="typing-indicator">
                Assistant is typing...
            </div>

            <div class="input-container">
                <input type="text" class="message-input" id="message-input" placeholder="Type your message here..." onkeypress="handleKeyPress(event)">
                <button class="send-button" id="send-button" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <script>
            // Use /api prefix which nginx proxies to backend
            const API_BASE = '/api';
            let isConnected = false;

            // Check connection on load
            window.addEventListener('load', function() {
                checkConnection();
                document.getElementById('message-input').focus();
            });

            async function checkConnection() {
                try {
                    const response = await fetch(`${API_BASE}/health`);
                    if (response.ok) {
                        updateConnectionStatus(true);
                        isConnected = true;
                    } else {
                        updateConnectionStatus(false);
                    }
                } catch (error) {
                    console.error('Connection check failed:', error);
                    updateConnectionStatus(false);
                    isConnected = false;
                }
            }

            function updateConnectionStatus(connected) {
                const statusIndicator = document.getElementById('connection-status');
                const statusText = document.getElementById('status-text');

                if (connected) {
                    statusIndicator.className = 'status-indicator status-online';
                    statusText.textContent = 'Connected to Family Assistant API';
                } else {
                    statusIndicator.className = 'status-indicator status-offline';
                    statusText.textContent = 'Disconnected from API - Check console for errors';
                }
            }

            function addMessage(content, isUser = false) {
                const messagesContainer = document.getElementById('chat-messages');
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;
                messageDiv.textContent = content;
                messagesContainer.appendChild(messageDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function showTypingIndicator() {
                document.getElementById('typing-indicator').style.display = 'block';
            }

            function hideTypingIndicator() {
                document.getElementById('typing-indicator').style.display = 'none';
            }

            async function sendMessage() {
                const input = document.getElementById('message-input');
                const sendButton = document.getElementById('send-button');
                const message = input.value.trim();

                if (!message) return;

                // Add user message
                addMessage(message, true);
                input.value = '';
                sendButton.disabled = true;
                showTypingIndicator();

                try {
                    // Use OpenAI-compatible endpoint
                    const response = await fetch(`${API_BASE}/v1/chat/completions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            messages: [{ role: 'user', content: message }],
                            user: 'guest',
                            stream: false
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const reply = data.choices[0].message.content;
                        addMessage(reply);
                        isConnected = true;
                        updateConnectionStatus(true);
                    } else {
                        const errorText = await response.text();
                        console.error('API error:', response.status, errorText);
                        addMessage(`Error ${response.status}: Unable to reach assistant. Please check backend API.`);
                        isConnected = false;
                        updateConnectionStatus(false);
                    }
                } catch (error) {
                    console.error('Network error:', error);
                    addMessage('Network error: Unable to connect to assistant. Please check console for details.');
                    isConnected = false;
                    updateConnectionStatus(false);
                } finally {
                    hideTypingIndicator();
                    sendButton.disabled = false;
                    input.focus();
                }
            }

            function sendQuickMessage(message) {
                document.getElementById('message-input').value = message;
                sendMessage();
            }

            function handleKeyPress(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            }
        </script>
    </body>
    </html>
