apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-assistant-app
  namespace: fa-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: family-assistant-app
  template:
    metadata:
      labels:
        app: family-assistant-app
    spec:
      containers:
      - name: app
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: html-content
          mountPath: /usr/share/nginx/html/index.html
          subPath: simple-frontend-app.html
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: html-content
        configMap:
          name: family-frontend-ui
      - name: nginx-config
        configMap:
          name: family-portal-nginx-config
