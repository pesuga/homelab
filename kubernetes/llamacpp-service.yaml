---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp-service
  namespace: default
  labels:
    app: llamacpp
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: llamacpp-service
  namespace: default
subsets:
- addresses:
  - ip: 100.86.122.109  # Tailscale IP of pesubuntu (compute node)
  ports:
  - name: http
    port: 8081
    protocol: TCP
