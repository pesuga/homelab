<!DOCTYPE html>
<html>
<head>
    <title>Mistral-7B-OpenOrca Test Interface</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .chat-container { border: 1px solid #ddd; padding: 20px; margin: 20px 0; }
        textarea { width: 100%; height: 100px; margin: 10px 0; padding: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; margin: 5px; }
        .response { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 5px; white-space: pre-wrap; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Mistral-7B-OpenOrca Test Interface</h1>
        <p>Test the Mistral model via API Proxy (OpenAI Compatible)</p>

        <div class="status success" id="status">
            ✅ Ready for testing
        </div>

        <div class="chat-container">
            <h3>💬 Chat with Mistral</h3>
            <textarea id="prompt" placeholder="Enter your message here...">Hello! Can you tell me about yourself?</textarea>
            <br>
            <button onclick="sendMessage()">Send Message</button>
            <button onclick="sendConcurrent()">Test Concurrent (2 requests)</button>
            <div id="response" class="response">Response will appear here...</div>
        </div>

        <div class="chat-container">
            <h3>📊 Service Status</h3>
            <button onclick="checkHealth()">Check Health</button>
            <button onclick="checkModels()">Check Models</button>
            <div id="statusResponse" class="response">Status info will appear here...</div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/v1';

        async function sendMessage() {
            const prompt = document.getElementById('prompt').value;
            const responseDiv = document.getElementById('response');
            const statusDiv = document.getElementById('status');

            statusDiv.innerHTML = '⏳ Sending request...';
            statusDiv.className = 'status';

            try {
                const response = await fetch(`${API_BASE}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'mistral-7b-openorca',
                        messages: [
                            { role: 'user', content: prompt }
                        ],
                        max_tokens: 200,
                        temperature: 0.7
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    responseDiv.textContent = data.choices[0].message.content;
                    statusDiv.innerHTML = '✅ Success! Response received';
                    statusDiv.className = 'status success';
                } else {
                    throw new Error(data.detail || 'Request failed');
                }
            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
                statusDiv.innerHTML = '❌ Request failed';
                statusDiv.className = 'status error';
            }
        }

        async function sendConcurrent() {
            const prompt = document.getElementById('prompt').value;
            const responseDiv = document.getElementById('response');
            const statusDiv = document.getElementById('status');

            statusDiv.innerHTML = '⏳ Testing concurrent requests...';
            statusDiv.className = 'status';

            const startTime = Date.now();

            try {
                // Send two requests concurrently
                const [response1, response2] = await Promise.all([
                    fetch(`${API_BASE}/chat/completions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'mistral-7b-openorca',
                            messages: [{ role: 'user', content: 'What is 1+1?' }],
                            max_tokens: 50
                        })
                    }),
                    fetch(`${API_BASE}/chat/completions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'mistral-7b-openorca',
                            messages: [{ role: 'user', content: 'What is 2+2?' }],
                            max_tokens: 50
                        })
                    })
                ]);

                const [data1, data2] = await Promise.all([response1.json(), response2.json()]);
                const duration = Date.now() - startTime;

                responseDiv.innerHTML = `
🚀 Concurrent Test Results (${duration}ms total):
Request 1: ${data1.choices[0].message.content}
Request 2: ${data2.choices[0].message.content}
                `;

                statusDiv.innerHTML = `✅ Concurrent test completed in ${duration}ms`;
                statusDiv.className = 'status success';

            } catch (error) {
                responseDiv.textContent = `Concurrent test failed: ${error.message}`;
                statusDiv.innerHTML = '❌ Concurrent test failed';
                statusDiv.className = 'status error';
            }
        }

        async function checkHealth() {
            const statusResponseDiv = document.getElementById('statusResponse');

            try {
                const response = await fetch(`${API_BASE}/../health`);
                const data = await response.json();

                if (response.ok) {
                    statusResponseDiv.textContent = `Health: ${JSON.stringify(data, null, 2)}`;
                } else {
                    throw new Error('Health check failed');
                }
            } catch (error) {
                statusResponseDiv.textContent = `Health check error: ${error.message}`;
            }
        }

        async function checkModels() {
            const statusResponseDiv = document.getElementById('statusResponse');

            try {
                const response = await fetch(`${API_BASE}/models`);
                const data = await response.json();

                if (response.ok) {
                    statusResponseDiv.textContent = `Models: ${JSON.stringify(data, null, 2)}`;
                } else {
                    throw new Error('Models check failed');
                }
            } catch (error) {
                statusResponseDiv.textContent = `Models check error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
